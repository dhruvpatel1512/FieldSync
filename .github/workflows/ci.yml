name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test backend/FieldSync.sln --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fieldsync-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: fieldsync-web/package-lock.json }
      - run: npm ci
      - run: npx ng build
