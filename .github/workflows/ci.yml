name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test backend/FieldSync.sln --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fieldsync-web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'npm', cache-dependency-path: fieldsync-web/package-lock.json }
      - run: npm ci
      - run: npx ng build --base-href /FieldSync/
      - run: cp dist/fieldsync-web/browser/index.html dist/fieldsync-web/browser/404.html   # GitHub Pages serves this for deep links like /admin
      - uses: actions/upload-pages-artifact@v5
        with: { path: fieldsync-web/dist/fieldsync-web/browser }

  # Deploys the API to https://fieldsync-api-dp.azurewebsites.net on every push to main (after tests pass).
  # OIDC login as a managed identity trusted only for this repo's main branch: no Azure secret stored in GitHub.
  api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }
      - run: dotnet publish backend/FieldSync.Api -c Release -o api-out
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with: { app-name: fieldsync-api-dp, package: api-out }

  # Publishes the web app to https://dhruvpatel1512.github.io/FieldSync/ on every push to main (after tests pass)
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
